  <script>
// Lettura del testo di un biglietto da visita dalla foto, sul telefono e senza rete (Tesseract.js in WebAssembly).
// Il riconoscimento da' le righe di testo; poi si propone a quale campo va ogni riga, e l'operatrice conferma
// o corregge prima che entri nella scheda. Nulla viene dedotto: solo righe stampate sul biglietto.
(function () {
  "use strict";
  const BASE = "vendor/ocr";
  let lavoratore = null;      // un solo motore, riusato per tutte le letture
  let inPreparazione = null;

  const disponibile = () => !!(window.Tesseract && window.WebAssembly && window.Worker);

  async function prepara(avanzamento) {
    if (window.SIM_OCR) return null; // simulazione: nessun motore da scaricare
    if (lavoratore) return lavoratore;
    if (inPreparazione) return inPreparazione;
    if (!disponibile()) throw new Error("La lettura dei biglietti non è disponibile su questo telefono");
    const assoluto = (p) => new URL(p, location.href).href;
    inPreparazione = window.Tesseract.createWorker(["ita", "eng"], 1, {
      workerPath: assoluto(`${BASE}/worker.min.js`),
      corePath: assoluto(`${BASE}/core`),
      langPath: assoluto(`${BASE}/lang`),
      workerBlobURL: false, // il motore resta un file dell'app (regole di sicurezza della pagina)
      gzip: true,
      cacheMethod: "write",
      logger: (m) => { if (avanzamento && m && typeof m.progress === "number") avanzamento(m.status || "", m.progress); }
    }).then((w) => { lavoratore = w; inPreparazione = null; return w; })
      .catch((e) => { inPreparazione = null; throw new Error("Preparazione della lettura non riuscita: " + (e && e.message ? e.message : e)); });
    return inPreparazione;
  }

  // Foto ridotta e in scala di grigi: lettura piu' rapida e spesso piu' precisa
  async function preparaImmagine(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const lato = 2000, k = Math.min(1, lato / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext("2d");
    g.filter = "grayscale(1) contrast(1.15)";
    g.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    return c;
  }

  async function leggi(file, avanzamento) {
    if (window.SIM_OCR) {
      for (const p of [0.2, 0.5, 0.8, 1]) { await new Promise((r) => setTimeout(r, 250)); if (avanzamento) avanzamento("recognizing text", p); }
      return window.SIM_OCR.map((t, i) => ({ testo: t, altezza: i === 0 ? 40 : 22, fiducia: 90 }));
    }
    const w = await prepara(avanzamento);
    const immagine = await preparaImmagine(file);
    const r = await w.recognize(immagine, {}, { text: true, blocks: true });
    const righe = [];
    for (const b of (r.data.blocks || [])) for (const p of (b.paragraphs || [])) for (const l of (p.lines || [])) {
      const testo = String(l.text || "").replace(/\s+/g, " ").trim();
      if (testo.length >= 2 && (l.confidence || 0) >= 35) righe.push({ testo, altezza: l.bbox ? l.bbox.y1 - l.bbox.y0 : 0, fiducia: Math.round(l.confidence || 0) });
    }
    if (!righe.length && r.data.text) String(r.data.text).split(/\n+/).map((x) => x.trim()).filter((x) => x.length >= 2).forEach((testo) => righe.push({ testo, altezza: 0, fiducia: 0 }));
    return righe;
  }

  // ---------------------------------------------------------------- a quale campo va ogni riga
  const PAESI = ["Italia", "Italy", "Germany", "Deutschland", "Germania", "France", "Francia", "Spain", "España", "Espana", "Spagna",
    "Portugal", "Portogallo", "United Kingdom", "Regno Unito", "UK", "England", "Netherlands", "Nederland", "Paesi Bassi", "Belgium", "Belgio",
    "Switzerland", "Schweiz", "Suisse", "Svizzera", "Austria", "Österreich", "Sweden", "Sverige", "Svezia", "Norway", "Norvegia", "Denmark",
    "Danimarca", "Finland", "Finlandia", "Poland", "Polska", "Polonia", "Greece", "Grecia", "Turkey", "Türkiye", "Turchia", "Romania",
    "Hungary", "Ungheria", "Czech Republic", "Czechia", "Croatia", "Croazia", "Slovenia", "Serbia", "Albania", "Israel", "Egypt", "Egitto",
    "Morocco", "Marocco", "Tunisia", "Algeria", "Saudi Arabia", "Arabia Saudita", "UAE", "United Arab Emirates", "Emirati Arabi Uniti", "Qatar",
    "Kuwait", "Iran", "Iraq", "India", "Pakistan", "China", "Cina", "Japan", "Giappone", "Korea", "Corea", "USA", "United States", "Stati Uniti",
    "Canada", "Mexico", "Messico", "Brazil", "Brasil", "Brasile", "Argentina", "Chile", "Cile", "Colombia", "Peru", "Perù", "Australia", "South Africa", "Sudafrica"];
  const RE_PAESE = new RegExp(`(^|[\\s,.\\-–(])(${PAESI.map((p) => p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})($|[\\s,.)])`, "i");
  const RE_EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
  const RE_SITO = /(^|\s)(https?:\/\/|www\.)\S+|\b[a-z0-9-]+\.(com|it|de|fr|es|eu|net|org|co\.uk|ch|nl|be|at)\b(?!@)/i;
  const RE_AZIENDA = /\b(s\.?\s?p\.?\s?a\.?|s\.?\s?r\.?\s?l\.?|s\.?\s?n\.?\s?c\.?|s\.?a\.?s\.?|gmbh|ag|kg|ltd\.?|limited|inc\.?|llc|plc|b\.?v\.?|n\.?v\.?|s\.?\s?a\.?|s\.?\s?l\.?|s\.?\s?a\.?\s?u\.?|oy|a\/s|ab|sas|sarl|corp\.?|group|gruppo|holding|hospital|ospedale|clinica|clinic|klinik|policlinico|medical|medica|healthcare|pharma|farmaceutic\w*|laborator\w*|surgical)\b/i;
  const RE_RUOLO = /\b(manager|director|direttore|direttrice|responsabile|buyer|purchas\w*|procurement|acquisti|sales|vendite|commerciale|export|import|marketing|ceo|cfo|coo|cto|owner|titolare|founder|fondatore|head|chief|president\w*|presidente|amministrator\w*|engineer|ingegnere|specialist|consultant|consulente|officer|coordinator|coordinatore|supervisor|assistant|assistente|product|area|key account|business development|dott\.?|dr\.?|prof\.?|md|phd|chirurg\w*|surgeon|nurse|infermier\w*)\b/i;

  // Una riga letta puo' contenere piu' cose (es. indirizzo e telefono su colonne affiancate, paese ed email):
  // email, telefoni e siti diventano righe a se', il resto resta una riga da classificare.
  const RE_TEL = /(?:\b(?:tel|phone|ph|mob|mobile|cell|cellulare|fax|t|m)\b\.?\s*[:.]?\s*)?\+?\(?\d[\d\s().\/-]{6,}\d/gi;
  function segmenta(r) {
    const pezzi = [];
    let resto = r.testo;
    resto = resto.replace(new RegExp(RE_EMAIL.source, "g"), (m) => { pezzi.push({ ...r, testo: m, campo: "email" }); return " "; });
    resto = resto.replace(/(https?:\/\/|www\.)\S+/gi, (m) => { pezzi.push({ ...r, testo: m, campo: "" }); return " "; });
    resto = resto.replace(RE_TEL, (m) => {
      if ((m.match(/\d/g) || []).length < 7) return m; // CAP, numeri civici
      const fax = /\bfax\b/i.test(m);
      pezzi.push({ ...r, testo: m.replace(/^(tel|phone|ph|mob|mobile|cell|cellulare|fax|t|m)\b\.?\s*[:.]?\s*/i, "").trim(), campo: fax ? "" : "telefono" });
      return " ";
    });
    resto = resto.replace(/\s+/g, " ").replace(/^[\s,;:|·•-]+|[\s,;:|·•-]+$/g, "").trim();
    if ((resto.match(/[A-Za-zÀ-ÿ0-9]/g) || []).length >= 3) pezzi.unshift({ ...r, testo: resto, campo: undefined });
    return pezzi;
  }

  function analizza(righe) {
    const assegnate = righe.flatMap(segmenta);
    for (const r of assegnate) {
      if (r.campo !== undefined) continue; // email, telefono o sito gia' riconosciuti
      r.campo = "";
      const t = r.testo;
      const email = t.match(RE_EMAIL);
      const cifre = (t.match(/\d/g) || []).length;
      if (email) { r.campo = "email"; r.valore = email[0]; continue; }
      if (/\bfax\b/i.test(t)) continue;
      if (cifre >= 7 && /^[\s+()\d./-]*$/.test(t.replace(/^(tel\.?|phone|ph\.?|mob\.?|mobile|cell\.?|cellulare|t\.|m\.|tel\/fax)\s*[:.]?\s*/i, ""))) {
        r.campo = "telefono"; r.valore = t.replace(/^(tel\.?|phone|ph\.?|mob\.?|mobile|cell\.?|cellulare|t\.|m\.)\s*[:.]?\s*/i, "").trim(); continue;
      }
      if (RE_SITO.test(t)) continue;
      const paese = t.match(RE_PAESE);
      if (paese && cifre <= 6) { r.campo = "paese"; r.valore = paese[2]; continue; }
      if (cifre >= 3) continue; // indirizzi, partite IVA, codici
      if (RE_AZIENDA.test(t)) { r.campo = "azienda"; continue; }
      if (RE_RUOLO.test(t)) { r.campo = "ruolo"; continue; }
    }

    const candidati = assegnate.filter((r) => !r.campo && /^[A-Za-zÀ-ÖØ-öø-ÿ'’.\- ]+$/.test(r.testo)
      && r.testo.split(/\s+/).length >= 2 && r.testo.split(/\s+/).length <= 4
      && r.testo.split(/\s+/).every((p) => /^[A-ZÀ-ÖØ-Þ]/.test(p) || /^(de|di|da|del|della|van|von|der|le|la|el|al|dos|das)$/i.test(p)));
    if (candidati.length) candidati.sort((a, b) => b.altezza - a.altezza)[0].campo = "nome";
    for (const campo of ["azienda", "ruolo", "paese"]) {
      // per questi campi si propone una sola riga (la prima trovata); le altre restano da scegliere a mano
      let visto = false;
      for (const r of assegnate) if (r.campo === campo) { if (visto) r.campo = ""; visto = true; }
    }
    return assegnate;
  }

  window.IF = window.IF || {};
  window.IF.OCR = { disponibile, prepara, leggi, analizza };
})();

  <script>
// Modalita' dimostrazione: simula il punto di raccolta sul dispositivo stesso.
// Serve a provare l'app (coda, assenza di rete, conferme, import in sede) senza server.
(function () {
  const CHIAVE = "if-demo-remoto";
  const SECONDI_IMPORT_SIMULATO = 20; // dopo quanto la "sede" importa una scheda ricevuta
  const SECONDI_SUNTO_SIMULATO = 40;  // dopo quanto arriva il sunto breve delle note vocali
  const SUNTO_SIMULATO = "Sunto di prova (dimostrazione): con il collegamento attivo qui arriva, preparato in sede, il sunto breve della nota vocale.";
  let memoria = {};

  function leggi() {
    try { return JSON.parse(localStorage.getItem(CHIAVE) || "{}"); } catch (e) { return memoria; }
  }
  function scrivi(r) {
    try { localStorage.setItem(CHIAVE, JSON.stringify(r)); } catch (e) { memoria = r; }
  }
  async function rete() {
    await IF.sleep(350 + Math.random() * 500);
    if (IF.impostazioni.simulaOffline || !navigator.onLine) throw new IF.ErroreRete("Nessuna connessione (simulata)");
  }

  const Demo = {
    nome: "demo",
    descrizione: "Dimostrazione: i dati restano su questo dispositivo e l'invio è simulato.",
    async init() {},
    haAccesso() { return true; },
    utente() { return null; },
    async accedi() {},
    async esci() {},

    async inviaScheda(scheda) {
      await rete();
      const r = leggi();
      const campi = IF.campiRemoti(scheda, IF.schema, "Allegati fiera");
      const esistente = r[scheda.id];
      r[scheda.id] = { remoteId: esistente ? esistente.remoteId : "D-" + (Object.keys(r).length + 1),
        campi, ricevutaIl: new Date().toISOString(), importata: false, allegati: esistente ? esistente.allegati : [] };
      scrivi(r);
      return { remoteId: r[scheda.id].remoteId };
    },

    async caricaAllegato(scheda, allegato) {
      await rete();
      await IF.sleep(Math.min(2000, allegato.dimensione / 400)); // tempo proporzionale alla dimensione
      const r = leggi();
      if (r[scheda.id]) {
        r[scheda.id].allegati = [...new Set([...(r[scheda.id].allegati || []), allegato.nome])];
        scrivi(r);
      }
      return { remoteUrl: `demo://Allegati fiera/${scheda.id}/${allegato.nome}` };
    },

    async confermaInvio(scheda) {
      await rete();
      const r = leggi();
      if (r[scheda.id]) { r[scheda.id].invioCompleto = scheda.versione; scrivi(r); }
    },

    async rimuoviAllegato(scheda, nomeFile) {
      await rete();
      const r = leggi();
      if (r[scheda.id]) { r[scheda.id].allegati = (r[scheda.id].allegati || []).filter((n) => n !== nomeFile); scrivi(r); }
    },

    // Simula la sede: una scheda ricevuta da piu' di N secondi risulta importata e, se ha note vocali,
    // poco dopo arriva il sunto breve. Il testo e' un segnaposto: in dimostrazione nessuna AI ascolta l'audio.
    async verificaImport(schede) {
      await rete();
      const r = leggi();
      const adesso = Date.now();
      const esiti = [];
      for (const s of schede) {
        const rem = r[s.id];
        if (!rem) continue;
        const ricevuta = new Date(rem.ricevutaIl).getTime();
        if (!rem.importata && adesso - ricevuta > SECONDI_IMPORT_SIMULATO * 1000) rem.importata = true;
        const conAudio = (rem.allegati || []).some((n) => n.startsWith("nota-vocale"));
        if (rem.importata && conAudio && adesso - ricevuta > SECONDI_SUNTO_SIMULATO * 1000
            && (!rem.sunto || rem.sunto.versione !== rem.campi.Versione)) {
          rem.sunto = { testo: SUNTO_SIMULATO, versione: rem.campi.Versione, il: new Date().toISOString() };
        }
        esiti.push({ id: s.id, importata: rem.importata && rem.campi.Versione === s.versioneInviata, sunto: rem.sunto || null });
      }
      scrivi(r);
      return esiti;
    }
  };

  window.IF = window.IF || {};
  window.IF.adapters = window.IF.adapters || {};
  window.IF.adapters.demo = Demo;
})();

</script>

// Invio al servizio aziendale (gestionale/server.py), lo stesso che pubblica l'app.
// Accesso con utente e password una sola volta: il server restituisce un token personale
// conservato sul telefono. Se il telefono viene perso, l'amministratore lo scollega dal gestionale.
(function () {
  const base = () => (window.APP_CONFIG.server && window.APP_CONFIG.server.api) || "../api";
  const accesso = () => (IF.impostazioni && IF.impostazioni.accesso) || null;

  async function chiama(metodo, percorso, { corpo, grezzo, tipo, ok404, senzaToken } = {}) {
    if ((IF.impostazioni && IF.impostazioni.simulaOffline) || !navigator.onLine) throw new IF.ErroreRete("Nessuna connessione");
    const intestazioni = {};
    const a = accesso();
    if (a && !senzaToken) intestazioni.Authorization = "Bearer " + a.token;
    if (corpo !== undefined) intestazioni["Content-Type"] = grezzo ? (tipo || "application/octet-stream") : "application/json";
    let r;
    try {
      r = await fetch(`${base()}/${percorso}`, {
        method: metodo, headers: intestazioni, cache: "no-store",
        body: corpo === undefined ? undefined : (grezzo ? corpo : JSON.stringify(corpo))
      });
    } catch (e) {
      throw new IF.ErroreRete("Server non raggiungibile: controlla la rete e la VPN");
    }
    let d = {};
    try { d = await r.json(); } catch (e) {}
    if (r.status === 404 && ok404) return null;
    // risposta che non viene dal servizio (nessun messaggio JSON): sul sito manca ancora l'archivio delle schede.
    // Non e' un errore della scheda: resta in coda sul telefono e parte quando l'archivio sara' attivo.
    if ((r.status === 404 || r.status === 405 || r.status === 501) && !d.errore) throw new IF.ErroreRete("Archivio delle schede non ancora attivo sul server: le schede restano sul telefono");
    if (r.status === 401) throw new IF.ErroreAccesso(senzaToken ? (d.errore || "Accesso non riuscito") : "Accesso scaduto: entra di nuovo dalle Impostazioni");
    if (r.status === 429) throw new IF.ErroreAccesso(d.errore || "Troppi tentativi: riprova più tardi");
    if (r.status >= 500 || r.status === 502 || r.status === 503 || r.status === 504) throw new IF.ErroreRete(`Server non disponibile (${r.status})`);
    if (!r.ok) throw new IF.ErroreScheda(d.errore || `Rifiutata dal server (${r.status})`);
    return d;
  }

  const Server = {
    nome: "server",
    descrizione: "Le schede vanno al server aziendale (serve la VPN attiva quando si invia). Senza rete restano in coda sul telefono.",
    async init() {},
    haAccesso() { return !!accesso(); },
    utente() { const a = accesso(); return a ? { nome: a.nome, username: a.username } : null; },
    async accedi() { location.hash = "#impostazioni"; },

    // Accesso con utente e password: il token resta sul telefono
    async entra(username, password) {
      const dispositivo = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "Telefono";
      const r = await chiama("POST", "accesso", { corpo: { username, password, tipo: "app", dispositivo: `App – ${dispositivo}` }, senzaToken: true });
      IF.impostazioni.accesso = { token: r.token, nome: r.nome, username: r.username, ruolo: r.ruolo };
      return r;
    },
    // Collegamento con il QR di attivazione mostrato in sede (codice monouso, senza password)
    async attiva(codice) {
      const dispositivo = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "Telefono";
      const r = await chiama("POST", "app/attiva", { corpo: { codice, dispositivo: `App – ${dispositivo}` }, senzaToken: true });
      IF.impostazioni.accesso = { token: r.token, nome: r.nome, username: r.username, ruolo: r.ruolo };
      return r;
    },
    async esci() {
      try { await chiama("POST", "uscita"); } catch (e) {}
      delete IF.impostazioni.accesso;
    },

    async inviaScheda(scheda) {
      await chiama("PUT", `app/schede/${scheda.id}`, { corpo: {
        versione: scheda.versione, fiera: scheda.fiera || "", compilatrice: scheda.compilatrice || "",
        intervistaIl: scheda.intervistaIl, dati: scheda.dati, versioneScheda: IF.schema.versione
      } });
      return { remoteId: scheda.id };
    },

    async caricaAllegato(scheda, allegato) {
      await chiama("PUT", `app/schede/${scheda.id}/allegati/${encodeURIComponent(allegato.nome)}`,
        { corpo: allegato.blob, grezzo: true, tipo: allegato.mime });
      return { remoteUrl: null };
    },

    // Dati e allegati sono arrivati: il server importa la scheda nel gestionale
    async confermaInvio(scheda) {
      await chiama("POST", `app/schede/${scheda.id}/completa`, { corpo: { versione: scheda.versione } });
    },

    async rimuoviAllegato(scheda, nomeFile) {
      await chiama("DELETE", `app/schede/${scheda.id}/allegati/${encodeURIComponent(nomeFile)}`);
    },

    verificaSempre: true,
    async verificaImport(schede) {
      const codici = schede.filter((x) => !x.esempio).map((x) => x.id).slice(0, 100);
      if (!codici.length) return [];
      const r = await chiama("POST", "app/stato", { corpo: { codici } });
      return schede.filter((s) => r.schede && r.schede[s.id]).map((s) => {
        const f = r.schede[s.id];
        return { id: s.id, importata: f.importata === true && Number(f.versione) === s.versioneInviata, sunto: f.sunto || null };
      });
    }
  };

  window.IF = window.IF || {};
  window.IF.adapters = window.IF.adapters || {};
  window.IF.adapters.server = Server;
})();

// Modalita' "file": nessun server. Le schede restano sul telefono; la sera si esporta un file (JSON con
// schede, note vocali e foto) e lo si passa in sede, dove il gestionale sul condiviso lo importa.
(function () {
  const PassaggioFile = {
    nome: "file",
    descrizione: "Nessun invio in rete: le schede restano su questo telefono. La sera premi «Esporta» e passa il file in sede (sul condiviso, per email o Teams): il gestionale lo importa.",
    async init() {},
    // account del gestionale a cui il telefono è collegato (QR del profilo, pagina Utenti): resta salvato sul telefono
    haAccesso() { return !!(IF.impostazioni.account && IF.impostazioni.account.id); },
    utente() { const a = IF.impostazioni.account; return a && a.id ? { nome: a.nome, username: a.username } : null; },
    async accedi() {},
    async esci() {}
  };

  // Prepara il file da passare in sede. tutte=false: solo le schede pronte (da esportare); tutte=true: anche quelle
  // gia' esportate (le bozze mai: non sono complete). In sede l'import tiene la versione piu' recente di ogni scheda.
  // ids (facoltativo): solo le schede scelte nell'elenco
  async function prepara({ tutte, ids }, avanzamento) {
    const S = IF.schema, CFG = window.APP_CONFIG;
    const scelte = Array.isArray(ids) ? new Set(ids) : null;
    const schede = (await IF.DB.tutteLeSchede()).filter((s) => !s.esempio && (!scelte || scelte.has(s.id))
      && (s.stato === "in_coda" || (tutte && (s.stato === "inviata" || s.stato === "importata"))))
      .sort((a, b) => (a.intervistaIl || "").localeCompare(b.intervistaIl || ""));
    const allegati = [];
    for (const s of schede) allegati.push(...(await IF.DB.allegatiDi(s.id)));
    const totale = allegati.reduce((n, a) => n + (a.dimensione || 0), 0) || 1;
    let fatto = 0;
    const base64 = (blob) => new Promise((ok, ko) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1] || "");
      r.onerror = () => ko(new Error("Allegato non leggibile sul telefono"));
      r.readAsDataURL(blob);
    });
    const imp = IF.impostazioni;
    const acc = imp.account;
    if (!acc || !acc.id || !acc.chiave) throw new Error("Telefono non collegato: inquadra prima il QR del tuo account (Impostazioni › Account)");
    const testa = {
      formato: "interviste-fiera-esportazione", versioneFormato: 1,
      app: CFG.nomeApp, versioneApp: CFG.versioneApp, versioneScheda: S.versione,
      esportatoIl: new Date().toISOString(), dispositivo: imp.dispositivo || "",
      compilatrice: acc.nome || imp.compilatrice || "", fiera: imp.fiera || "", tutte: !!tutte,
      // il gestionale importa solo i file dei telefoni collegati a un account attivo
      account: { id: acc.id, username: acc.username, nome: acc.nome }, chiave: acc.chiave
    };
    // il file si compone a pezzi: con molte note vocali una sola stringa enorme peserebbe troppo sul telefono
    const pezzi = [JSON.stringify(testa).slice(0, -1), ',"schede":', JSON.stringify(schede.map((s) => ({
      id: s.id, versione: s.versione, stato: s.stato, fiera: s.fiera || "", compilatrice: s.compilatrice || "",
      intervistaIl: s.intervistaIl, creataIl: s.creataIl, modificataIl: s.modificataIl, dati: s.dati
    }))), ',"allegati":['];
    let primo = true;
    for (const a of allegati) {
      const meta = { id: a.id, schedaId: a.schedaId, tipo: a.tipo, nome: a.nome, mime: a.mime, dimensione: a.dimensione, creatoIl: a.creatoIl };
      const b64 = await base64(a.blob);
      pezzi.push((primo ? "" : ",") + JSON.stringify(meta).slice(0, -1) + ',"base64":"', b64, '"}');
      primo = false;
      fatto += a.dimensione || 0;
      if (avanzamento) avanzamento(fatto / totale);
    }
    pezzi.push("]}");
    const pulito = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase().slice(0, 30);
    const d = new Date(), due = (n) => String(n).padStart(2, "0");
    const nome = ["interviste", pulito(imp.compilatrice) || "telefono", pulito(imp.fiera),
      `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}-${due(d.getHours())}${due(d.getMinutes())}`].filter(Boolean).join("_") + ".json";
    const file = new File(pezzi, nome, { type: "application/json" });
    return { file, schede: schede.map((s) => ({ id: s.id, versione: s.versione })), nAllegati: allegati.length };
  }

  // Dopo l'esportazione: le schede risultano «esportate» (se nel frattempo sono cambiate restano da esportare)
  async function segnaEsportate(elenco) {
    const adesso = new Date().toISOString();
    for (const { id, versione } of elenco) {
      await IF.DB.aggiornaScheda(id, (x) => {
        if (x.versione !== versione || x.stato === "bozza") return;
        x.stato = "inviata"; x.versioneInviata = versione; x.datiInviatiVersione = versione; x.inviataIl = adesso; x.ultimoErrore = null;
      });
    }
    await IF.DB.scrivi("ultima-esportazione", adesso);
    IF.eventi.emit("lista");
  }

  window.IF = window.IF || {};
  window.IF.adapters = window.IF.adapters || {};
  window.IF.adapters.file = PassaggioFile;
  window.IF.Esporta = { prepara, segnaEsportate };
})();

  <script>
// Motore di invio: svuota la coda verso il punto di raccolta, prima i dati poi gli allegati,
// e verifica quali schede risultano importate in sede.
// Stati di una scheda: bozza -> in_coda -> inviata -> importata
(function () {
  let inCorso = false;
  let ciclo = 0;
  let timer = null;
  const ascoltatori = new Set();

  const stato = {
    connessione: navigator.onLine ? "online" : "offline", // online | offline | accesso
    ultimoInvio: null,
    messaggio: "",
    inCorso: false
  };

  function notifica() { for (const f of ascoltatori) { try { f({ ...stato }); } catch (e) {} } }

  function adapter() { return IF.adapter; }

  async function eseguiCiclo() {
    if (inCorso) return;
    const a = adapter();
    if (!a) return;
    if (!a.haAccesso()) { stato.connessione = "accesso"; stato.messaggio = "Entra con il tuo utente (Impostazioni) per inviare"; notifica(); return; }

    inCorso = true; stato.inCorso = true; notifica();
    ciclo++;
    try {
      const schede = await IF.DB.tutteLeSchede();
      const coda = schede.filter((s) => s.stato === "in_coda")
        .sort((x, y) => (x.inCodaIl || "").localeCompare(y.inCodaIl || ""));

      // Dopo ogni attesa di rete la scheda si rilegge: le correzioni fatte nel frattempo (versione piu' alta)
      // restano e partono al giro successivo; una scheda eliminata nel frattempo non ricompare.
      const segnaErrore = async (id, e) => {
        await IF.DB.aggiornaScheda(id, (x) => { x.ultimoErrore = e.message; x.tentativi = (x.tentativi || 0) + 1; });
        IF.eventi.emit("scheda", id);
      };

      // 1) Dati di tutte le schede in coda (leggeri, arrivano subito anche con segnale debole)
      for (const s of coda) {
        if (s.datiInviatiVersione === s.versione) continue;
        try {
          const r = await a.inviaScheda(s);
          await IF.DB.aggiornaScheda(s.id, (x) => {
            x.remoteId = r.remoteId;
            if (!(x.datiInviatiVersione > s.versione)) x.datiInviatiVersione = s.versione; // la versione davvero inviata
            x.ultimoErrore = null;
          });
          IF.eventi.emit("scheda", s.id);
        } catch (e) {
          if (e.tipo === "rete" || e.tipo === "accesso") throw e;
          await segnaErrore(s.id, e);
        }
      }

      // 2) Allegati e rimozioni, poi conferma finale della scheda
      for (const { id } of coda) {
        const s = await IF.DB.scheda(id);
        if (!s || s.stato !== "in_coda" || s.datiInviatiVersione !== s.versione) continue; // dati non ancora arrivati
        try {
          for (const nome of [...(s.allegatiDaRimuovere || [])]) {
            await a.rimuoviAllegato(s, nome);
            await IF.DB.aggiornaScheda(id, (x) => { x.allegatiDaRimuovere = (x.allegatiDaRimuovere || []).filter((n) => n !== nome); });
          }
          for (const al of (await IF.DB.allegatiDi(id)).filter((x) => !x.caricato)) {
            const ancora = (await IF.DB.allegatiDi(id)).find((x) => x.id === al.id);
            if (!ancora || ancora.caricato) continue; // tolto (o gia' inviato) nel frattempo
            const r = await a.caricaAllegato(s, ancora);
            const dopo = (await IF.DB.allegatiDi(id)).find((x) => x.id === al.id);
            if (dopo) {
              dopo.caricato = true; dopo.remoteUrl = r.remoteUrl || null;
              await IF.DB.salvaAllegato(dopo);
            } else {
              // tolto mentre saliva: arrivato in sede, va tolto anche li' (la scheda ha gia' una versione nuova)
              await IF.DB.aggiornaScheda(id, (x) => { x.allegatiDaRimuovere = [...new Set([...(x.allegatiDaRimuovere || []), al.nome])]; });
            }
            IF.eventi.emit("scheda", id);
          }
          // Dati e allegati arrivati: lo si dichiara al punto di raccolta, cosi' la sede importa
          // la scheda solo quando e' completa (mai senza gli allegati ancora in viaggio)
          if (a.confermaInvio) await a.confermaInvio(s);
          // Ricevuta completa: dati + allegati, se nel frattempo la scheda non e' cambiata
          const adesso = new Date().toISOString();
          const fatta = await IF.DB.aggiornaScheda(id, (x) => {
            if (x.versione !== s.versione || x.stato !== "in_coda" || (x.allegatiDaRimuovere || []).length) return;
            x.stato = "inviata"; x.versioneInviata = s.versione; x.inviataIl = adesso; x.ultimoErrore = null;
          });
          if (fatta && fatta.stato === "inviata") stato.ultimoInvio = adesso;
          IF.eventi.emit("scheda", id);
        } catch (e) {
          if (e.tipo === "rete" || e.tipo === "accesso") throw e;
          await segnaErrore(id, e);
        }
      }

      // 3) Verifica in sede (non a ogni ciclo, per non sovraccaricare): import e sunto breve delle note vocali
      if (coda.length || a.verificaSempre || ciclo % (APP_CONFIG.sync.verificaImportOgni || 3) === 1) {
        const daControllare = [];
        for (const s of await IF.DB.tutteLeSchede()) {
          if (s.stato === "inviata" || (await attendeSunto(s))) daControllare.push(s);
        }
        if (daControllare.length) {
          for (const esito of await a.verificaImport(daControllare)) {
            const attuale = await IF.DB.scheda(esito.id);
            if (!attuale) continue;
            let cambiata = false;
            if (esito.importata && attuale.stato === "inviata") {
              attuale.stato = "importata"; attuale.importataIl = new Date().toISOString(); cambiata = true;
            }
            const nuovo = esito.sunto && esito.sunto.testo
              && (!attuale.sunto || attuale.sunto.testo !== esito.sunto.testo || attuale.sunto.versione !== esito.sunto.versione);
            if (nuovo) { attuale.sunto = { ...esito.sunto, ricevutoIl: new Date().toISOString() }; cambiata = true; }
            if (cambiata) {
              await IF.DB.salvaScheda(attuale); IF.eventi.emit("scheda", attuale.id);
              if (nuovo) IF.eventi.emit("sunto", attuale.id);
            }
          }
        }
      }

      // 4) Pulizia: cancella dal telefono le schede importate da piu' di N giorni
      await pulizia(false);

      stato.connessione = "online"; stato.messaggio = "";
    } catch (e) {
      if (e.tipo === "accesso") { stato.connessione = "accesso"; stato.messaggio = e.message; }
      else { stato.connessione = "offline"; stato.messaggio = e.message || "Rete non disponibile"; }
    } finally {
      inCorso = false; stato.inCorso = false;
      IF.eventi.emit("lista");
      notifica();
    }
  }

  // Una scheda arrivata in sede con note vocali aspetta il sunto breve per qualche ora dopo l'invio
  // (o quello aggiornato, se la scheda e' stata reinviata dopo modifiche).
  async function attendeSunto(s) {
    if (s.stato !== "importata" || !s.inviataIl) return false;
    if (Date.now() - new Date(s.inviataIl).getTime() > (APP_CONFIG.sync.oreAttesaSunto || 12) * 3600000) return false;
    if (s.sunto && s.sunto.versione >= s.versioneInviata) return false;
    return (await IF.DB.allegatiDi(s.id)).some((x) => x.tipo === "audio");
  }

  async function pulizia(tutte) {
    const giorni = APP_CONFIG.pulizia.giorniDopoImport;
    if (!tutte && !giorni) return 0;
    const limite = Date.now() - (giorni || 0) * 86400000;
    let n = 0;
    for (const s of await IF.DB.tutteLeSchede()) {
      if (s.stato !== "importata") continue;
      if (tutte || new Date(s.importataIl).getTime() < limite) { await IF.DB.eliminaScheda(s.id); n++; }
    }
    if (n) IF.eventi.emit("lista");
    return n;
  }

  const Sync = {
    stato: () => ({ ...stato }),
    ascolta(f) { ascoltatori.add(f); return () => ascoltatori.delete(f); },
    async adesso() { await eseguiCiclo(); },
    pulizia,
    avvia() {
      window.addEventListener("online", () => { stato.connessione = "online"; notifica(); eseguiCiclo(); });
      window.addEventListener("offline", () => { stato.connessione = "offline"; stato.messaggio = "Rete non disponibile"; notifica(); });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") eseguiCiclo(); });
      clearInterval(timer);
      timer = setInterval(eseguiCiclo, (APP_CONFIG.sync.intervalloSecondi || 30) * 1000);
      eseguiCiclo();
    }
  };

  window.IF = window.IF || {};
  window.IF.Sync = Sync;
})();

</script>

    ? { bozza: "Bozza", in_coda: "Da esportare", inviata: "Esportata", importata: "Importata" }

  // ---------- Avvio ----------
  async function avvio() {
    archivioInMemoria = await DB.inMemoria();
    Object.assign(IF.impostazioni, await DB.leggi("impostazioni", {}));

    const a = IF.adapters[CFG.modalita];
    try {
      if (!a) throw new Error(`Modalità sconosciuta in config.js: ${CFG.modalita}`);
      await a.init();
      IF.adapter = a;
      const u = a.utente();
      if (u) { IF.impostazioni.compilatrice = u.nome; await salvaImpostazioni(); }
    } catch (e) {
      erroreConfig = e.message;
      IF.adapter = null;
    }

    if (CFG.modalita === "demo" && !(await DB.leggi("demo-esempi-v2", false))) await creaEsempi();
    if (FILE && !IF.impostazioni.dispositivo) { IF.impostazioni.dispositivo = IF.uuid(); await salvaImpostazioni(); }

    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    IF.eventi.on("lista", () => { if (vistaCorrente() === "lista") disegnaElenco(); aggiornaStrisciaInvio(); aggiornaTabbar(); });
    IF.eventi.on("scheda", (id) => { if (location.hash === `#scheda/${id}`) aggiornaStatoEditor(id); });
    IF.eventi.on("sunto", async (id) => {
      const s = await DB.scheda(id);
      if (s) avviso(`Arrivato il sunto: ${IF.titoloScheda(s, S)}`, "ok");
    });
    IF.Sync.ascolta(() => aggiornaStrisciaInvio());
    // Aperta dal QR (…/#attiva=codice, oppure …/#collega=codice del QR dell'account): il codice si toglie subito dall'indirizzo
    const codice = codiceAttivazione(location.hash) || codiceAttivazione(location.search);
    const conto = FILE ? codiceAccount(location.hash) : null;
    if (codice || conto) { try { history.replaceState(null, "", location.href.split("#")[0].split("?")[0]); } catch (e) { location.hash = ""; } }
    if (conto) await collegaAccount(conto);
    window.addEventListener("hashchange", async () => {
      // QR dell'account aperto mentre l'app è già aperta (stessa pagina, cambia solo la parte dopo #)
      const nuovo = FILE ? codiceAccount(location.hash) : null;
      if (nuovo) { try { history.replaceState(null, "", location.href.split("#")[0] + "#lista"); } catch (e) {} await collegaAccount(nuovo); }
      disegna();
    });
    disegna();
    if (IF.adapter && !FILE) IF.Sync.avvia();
    if (FILE) promemoriaSerale();
    if (conto && !inApp()) setTimeout(() => guidaInstallazione(suIPhone()), 900);
    if (codice) {
      if (suIPhone() && !inApp()) guidaInstallazione(true); // il codice si usa poi dall'app installata
      else {
        if (await attivaTelefono(codice)) disegna();
        if (!inApp()) setTimeout(() => guidaInstallazione(false), 900);
      }
    }
  }

  async function salvaImpostazioni() { await DB.scrivi("impostazioni", IF.impostazioni); }

  // ---------- Installazione e attivazione con il QR mostrato in sede ----------
  const inApp = () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const suIPhone = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let richiestaInstallazione = null; // Android/Chrome: permette di mostrare il pulsante "Installa"
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); richiestaInstallazione = e; });
  window.addEventListener("appinstalled", () => { richiestaInstallazione = null; });
  function codiceAttivazione(testo) {
    const m = String(testo || "").match(/[#&?]attiva=([A-Za-z0-9_-]{16,64})/);
    return m ? m[1] : null;
  }
  async function attivaTelefono(codice) {
    if (!IF.adapter || !IF.adapter.attiva) { avviso("Il QR di attivazione funziona solo con il server aziendale", "errore"); return false; }
    try {
      const r = await IF.adapter.attiva(codice);
      IF.impostazioni.compilatrice = r.nome;
      await salvaImpostazioni();
      avviso(`Benvenuta, ${r.nome.split(" ")[0]}: telefono collegato`, "ok");
      IF.Sync.adesso();
      return true;
    } catch (e) { avviso(e.message, "errore"); return false; }
  }
  // QR dell'account (versione sul condiviso): {v, i: id, u: utente, n: nome, k: chiave del telefono} in base64url
  function codiceAccount(testo) {
    const m = String(testo || "").match(/[#&?]collega=([A-Za-z0-9_-]{20,600})/);
    if (!m) return null;
    try {
      const t = m[1].replace(/-/g, "+").replace(/_/g, "/");
      const j = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t), (c) => c.charCodeAt(0))));
      if (j.v !== 1 || !/^[A-Za-z0-9_-]{4,40}$/.test(j.i) || !/^[A-Za-z0-9_-]{16,60}$/.test(j.k) || !String(j.n || "").trim()) return null;
      return { id: j.i, username: String(j.u || "").slice(0, 40), nome: String(j.n).trim().slice(0, 120), chiave: j.k };
    } catch (e) { return null; }
  }
  async function collegaAccount(a) {
    const prima = IF.impostazioni.account;
    IF.impostazioni.account = { ...a, il: new Date().toISOString() };
    IF.impostazioni.compilatrice = a.nome;
    await salvaImpostazioni();
    avviso(prima && prima.id && prima.id !== a.id ? `Telefono collegato all'account di ${a.nome} (prima: ${prima.nome})`
      : `Benvenuta, ${a.nome.split(" ")[0]}: telefono collegato`, "ok");
    aggiornaStrisciaInvio(); aggiornaTabbar();
  }
  async function collegaDaScansione() {
    const testo = await IF.QR.apri("il QR del tuo account, nella pagina Utenti del gestionale");
    if (!testo) return false;
    const a = codiceAccount(testo);
    if (!a) { avviso("Questo non è il QR di un account: chiedi in sede il «QR del telefono» del tuo account", "errore"); return false; }
    await collegaAccount(a);
    return true;
  }
  async function attivaDaScansione() {
    const testo = await IF.QR.apri("il QR di attivazione mostrato in sede");
    if (!testo) return;
    const codice = codiceAttivazione(testo);
    if (!codice) { avviso("Questo non è un QR di attivazione: chiedi in sede il «QR di attivazione»", "errore"); return; }
    if (await attivaTelefono(codice)) { if (location.hash === "#lista") disegna(); else location.hash = "#lista"; }
  }
  // Su iPhone l'app aggiunta alla schermata Home tiene i dati separati da Safari: il collegamento si fa dall'icona
  function guidaInstallazione(dopoIPhone) {
    const iphone = suIPhone();
    const corpo = iphone ? `
        <h2>Aggiungi l'app alla schermata Home</h2>
        <ol class="passi-installa">
          <li>Tocca <strong>Condividi</strong> nella barra di Safari (il quadrato con la freccia verso l'alto).</li>
          <li>Scegli <strong>«Aggiungi alla schermata Home»</strong> e poi <strong>«Aggiungi»</strong>.</li>
          <li>Apri <strong>Interviste</strong> dall'icona${dopoIPhone ? `, tocca <strong>${FILE ? "«Inquadra il QR del tuo account»" : "«Attiva con il QR»"}</strong> e inquadra di nuovo lo stesso QR` : FILE ? " e imposta la fiera in Impostazioni" : " ed entra con il tuo utente"}.</li>
        </ol>
        ${dopoIPhone ? `<p class="nota">Su iPhone l'app sulla schermata Home tiene i suoi dati separati da Safari: per questo il collegamento si fa dall'icona.</p>` : ""}`
      : richiestaInstallazione ? `
        <h2>Installa l'app</h2>
        <p>Comparirà un'icona sulla schermata Home: l'app si apre a tutto schermo e funziona anche senza rete.</p>`
      : `
        <h2>Installa l'app</h2>
        <ol class="passi-installa">
          <li>Apri il menu del browser (i tre puntini <strong>⋮</strong> in alto a destra).</li>
          <li>Tocca <strong>«Installa app»</strong> oppure <strong>«Aggiungi a schermata Home»</strong>.</li>
          <li>Da quel momento apri <strong>Interviste</strong> dall'icona.</li>
        </ol>`;
    const { d, chiudi } = apriFoglio(`${corpo}
      <div class="dialogo-azioni"><button class="btn btn-secondario" type="button" id="instDopo">${iphone ? "Ho capito" : "Più tardi"}</button>
      ${!iphone && richiestaInstallazione ? `<button class="btn btn-primario" type="button" id="instSi">Installa</button>` : ""}</div>`);
    d.querySelector("#instDopo").onclick = chiudi;
    d.querySelector(".dialogo-velo").onclick = chiudi;
    const si = d.querySelector("#instSi");
    if (si) si.onclick = async () => { chiudi(); try { await richiestaInstallazione.prompt(); } catch (e) {} richiestaInstallazione = null; };
  }

  function vistaCorrente() {
    const x = location.hash;
    if (x.startsWith("#scheda/")) return "scheda";
    if (x === "#impostazioni") return "impostazioni";
    if (x === "#riepilogo") return "riepilogo";
    if (x === "#info" || x === "#info-rete") return "info";
    return "lista";
  }

  // Profondita' delle schermate: decide il verso della transizione (avanti / indietro)
  const PROFONDITA = { lista: 0, riepilogo: 0, info: 0, impostazioni: 0, scheda: 1 };
  let vistaPrecedente = null;
  let primoDisegno = true;   // primo disegno dopo l'apertura dell'app
  let inTransizione = false; // durante la transizione tra schermate niente animazioni interne (sarebbero invisibili e pesanti)

  function disegna() {
    const v = vistaCorrente();
    const verso = vistaPrecedente === null ? "" : PROFONDITA[v] > PROFONDITA[vistaPrecedente] ? "avanti"
      : PROFONDITA[v] < PROFONDITA[vistaPrecedente] ? "indietro" : "";
    vistaPrecedente = v;
    const esegui = async () => {
      if (pulisciVista) { pulisciVista(); pulisciVista = null; }
      window.scrollTo(0, 0);
      aggiornaTabbar();
      if (daCollegare()) return vistaCollega();
      if (v === "scheda") return vistaScheda(decodeURIComponent(location.hash.slice(8)));
      if (v === "impostazioni") return vistaImpostazioni();
      if (v === "riepilogo") return vistaRiepilogo();
      if (v === "info") return vistaInfo(location.hash === "#info-rete" ? "rete" : "prezzi");
      return vistaElenco();
    };
    const movimentoRidotto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Niente transizioni "fotografate" del browser (startViewTransition): catturare lo schermo con le barre in vetro
    // costava un fotogramma lungo a ogni cambio e congelava la barra in basso. Si anima solo il contenuto nuovo,
    // in composizione (transform e opacita'): da destra entrando in una scheda, da sinistra tornando, una breve
    // dissolvenza tra le sezioni della barra. Al primo avvio entrano i blocchi a cascata.
    const primo = primoDisegno;
    primoDisegno = false;
    if (primo || movimentoRidotto) { esegui(); return; }
    inTransizione = true; // niente cascate e conteggi animati durante il cambio: basta l'entrata del contenuto
    Promise.resolve(esegui()).catch(() => {}).then(() => {
      inTransizione = false;
      const classe = verso === "avanti" ? "entra-avanti" : verso === "indietro" ? "entra-indietro" : "cambio";
      vista.classList.remove("cambio", "entra-avanti", "entra-indietro");
      void vista.offsetWidth;
      vista.classList.add(classe);
    });
  }

  // ---------- Navigazione in basso: capsula flottante in vetro + pulsante "nuova intervista" ----------
  const TAB = [
    { id: "lista", href: "#lista", testo: "Interviste", icona: "lista" },
    { id: "riepilogo", href: "#riepilogo", testo: "Riepilogo", icona: "grafico" },
    { id: "info", href: "#info", testo: "Info", icona: "info" },
    { id: "impostazioni", href: "#impostazioni", testo: "Impostazioni", icona: "ingranaggio" }
  ];
  function costruisciTabbar() {
    const box = document.getElementById("tabbarInterno");
    if (box.dataset.pronta) return;
    box.dataset.pronta = "1";
    box.innerHTML = `
      <div class="capsula vetro" id="capsula">
        ${TAB.map((t) => `<a class="tab" href="${t.href}" data-tab="${t.id}">${icona(t.icona)}<span class="etichetta-tab">${t.testo}</span></a>`).join("")}
      </div>
      <button class="btn-crea vetro" id="btnCrea" type="button" aria-label="Nuova intervista" title="Nuova intervista">${icona("piu")}</button>`;
    document.getElementById("btnCrea").onclick = nuovaScheda;
    // la barra reagisce subito al tocco, prima che la nuova schermata sia pronta
    box.addEventListener("pointerdown", (e) => {
      const a = e.target.closest(".tab");
      if (a) segnaTab(a.dataset.tab);
    });
  }
  function segnaTab(id) {
    const indice = Math.max(0, TAB.findIndex((t) => t.id === id));
    const capsula = document.getElementById("capsula");
    if (capsula) capsula.style.setProperty("--indice", indice);
    document.querySelectorAll(".tab").forEach((a) => {
      if (a.dataset.tab === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }

  async function aggiornaTabbar() {
    const nav = document.getElementById("tabbar");
    const v = vistaCorrente();
    nav.hidden = v === "scheda" || daCollegare();
    if (nav.hidden) return;
    costruisciTabbar();
    segnaTab(v);
    const c = await conteggi();
    const lista = document.querySelector('.tab[data-tab="lista"]');
    const p = lista.querySelector(".pallino");
    if (c.in_coda > 0 && !p) lista.insertAdjacentHTML("beforeend", `<span class="pallino" aria-label="schede in attesa di invio"></span>`);
    if (!c.in_coda && p) p.remove();
  }

  // Scorrimento: barra in alto in vetro quando il contenuto le passa sotto, capsula ridotta scendendo
  let ultimoScroll = 0, scrollInAttesa = false;
  function aggiornaScroll() {
    scrollInAttesa = false;
    const y = window.scrollY, html = document.documentElement;
    const scorso = y > 8;
    if (scorso !== html.classList.contains("scorso")) html.classList.toggle("scorso", scorso);
    let ridotta = html.classList.contains("ridotta");
    if (y < 60 || y < ultimoScroll - 4) ridotta = false;
    else if (y > ultimoScroll + 4 && y > 120) ridotta = true;
    if (ridotta !== html.classList.contains("ridotta")) html.classList.toggle("ridotta", ridotta);
    ultimoScroll = y;
  }
  window.addEventListener("scroll", () => {
    if (!scrollInAttesa) { scrollInAttesa = true; requestAnimationFrame(aggiornaScroll); }
  }, { passive: true });

  // ---------- Animazioni di supporto ----------
  const movimentoRidotto = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function contaSu(el, fine) {
    if (!el) return;
    if (movimentoRidotto() || inTransizione || fine <= 0) { el.textContent = fine; return; }
    const inizio = performance.now(), durata = 700;
    const passo = (t) => {
      const k = Math.min(1, (t - inizio) / durata), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(fine * e);
      if (k < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  }

  // Le barre si scoprono da sinistra: si anima una copertura con transform (composito, nessun ricalcolo della pagina)
  function animaBarre(radice) {
    if (!radice || movimentoRidotto() || inTransizione) return;
    radice.querySelectorAll(".traccia").forEach((tr, i) => {
      tr.style.setProperty("--ritardo", `${Math.min(i, 8) * 40}ms`);
      tr.classList.remove("rivela"); void tr.offsetWidth; tr.classList.add("rivela");
    });
  }

  // Entrata a cascata dei blocchi indicati (solo all'apertura: tra schermate c'e' gia' la transizione)
  function cascata(elementi) {
    if (movimentoRidotto() || inTransizione) return;
    [...elementi].slice(0, 10).forEach((el, i) => { el.style.setProperty("--i", i); el.classList.add("entra"); });
  }

  function barraPrincipale() {
    barra.innerHTML = `
      <span class="targa-logo"><img src="${LOGO}" alt="Assut Europe – Suture chirurgiche" width="124" height="28"></span>
      ${IF.impostazioni.fiera ? `<span class="chip-fiera">${icona("luogo")}<span>${h(IF.impostazioni.fiera)}</span></span>` : ""}`;
  }

  // ---------- Versione sul condiviso: l'app si usa dopo aver inquadrato il QR del proprio account ----------
  const daCollegare = () => FILE && !!IF.adapter && !IF.adapter.haAccesso();
  function vistaCollega() {

      <section class="gruppo">

        <button class="btn btn-primario" type="button" id="btnCollega">${icona("qr")}<span>Inquadra il QR del tuo account</span></button>
        <p class="nota">Si fa una volta sola: il collegamento resta salvato su questo telefono. Il tuo nome viene messo da solo su ogni scheda.</p>
      </section>
      ${!inApp() ? `<section class="gruppo"><button class="btn btn-secondario" type="button" id="btnInstalla">Installa l'app sulla schermata Home</button></section>` : ""}`;
    document.getElementById("btnCollega").onclick = async () => { if (await collegaDaScansione()) disegna(); };
    const bin = document.getElementById("btnInstalla");
    if (bin) bin.onclick = () => guidaInstallazione(false);

  // ---------- Esempi per la modalita' dimostrazione ----------
  async function creaEsempi() {
    const adesso = Date.now();
    const base = (minFa, dati, stato) => {
      const iso = new Date(adesso - minFa * 60000).toISOString();
      return {
        id: IF.uuid(), esempio: true, creataIl: iso, modificataIl: iso, intervistaIl: iso,
        fiera: "Fiera di prova", compilatrice: "Collega di prova", dati, stato,
        versione: 1, versioneInviata: stato === "importata" ? 1 : 0,
        datiInviatiVersione: stato === "importata" ? 1 : 0,
        inCodaIl: stato !== "bozza" ? iso : null,
        inviataIl: stato === "importata" ? iso : null,
        importataIl: stato === "importata" ? iso : null,
        allegatiDaRimuovere: []
      };
    };
    const esempi = [
      base(95, { nome: "Contatto di esempio", azienda: "Esempio Ospedale Nord", ruolo: "Responsabile acquisti", paese: "Germania",
        modalita: "Evento", nostra_fabbricazione: ["Suture", "Emostatico"], identificazione: ["Potenziale cliente"],
        interesse: "Interesse forte e concreto", giudizio: "A – Ottimo / alto potenziale",
        note_generali: "Scheda di esempio, già importata in sede.", azione_followup: "Inviare listino" }, "importata"),
      base(30, { nome: "Fornitore di esempio", azienda: "Esempio Componenti Srl", paese: "Italia",
        modalita: "Evento", identificazione: ["Fornitore"], interesse: "Interessato / curioso",
        note_generali: "Scheda di esempio rimasta in coda: parte appena apri l'app." }, "in_coda"),
      base(5, { nome: "", azienda: "Esempio Distribuzione SA", paese: "Spagna", modalita: "Evento", identificazione: ["Progetto"] }, "bozza")
    ];
    for (const e of esempi) await DB.salvaScheda(e);
    if (!IF.impostazioni.fiera) IF.impostazioni.fiera = "Fiera di prova";
    if (!IF.impostazioni.compilatrice) IF.impostazioni.compilatrice = "Collega di prova";
    await salvaImpostazioni();
    await DB.scrivi("demo-esempi-v2", true);
  }

  // ---------- Striscia di stato invio ----------
  async function conteggi() {
    const schede = await DB.tutteLeSchede();
    const c = { bozza: 0, in_coda: 0, inviata: 0, importata: 0, totale: schede.length };
    for (const s of schede) c[s.stato] = (c[s.stato] || 0) + 1;
    return c;
  }

  async function aggiornaStrisciaInvio() {
    const el = document.getElementById("strisciaInvio");
    if (!el) return;
    const st = IF.Sync.stato();
    const c = await conteggi();
    let classe, testo, dettaglio;
    if (FILE && IF.adapter) {
      const ultima = await DB.leggi("ultima-esportazione", null);
      if (c.in_coda) {
        classe = "attenzione"; testo = `${c.in_coda} da esportare`;
        dettaglio = "La sera premi «Esporta» e passa il file in sede";
      } else {
        classe = "ok"; testo = c.inviata ? "Tutto esportato" : "Nessuna scheda da esportare";
        dettaglio = ultima ? `Ultimo file alle ${IF.ora(ultima)} del ${IF.giornoLungo(new Date(ultima)).toLowerCase()}` : "Completa le interviste: la sera le esporti in un file";
      }
      el.className = `stato-invio ${classe}`;
      el.innerHTML = `<span class="spia" aria-hidden="true"></span>
        <span class="testo"><strong>${h(testo)}</strong><span>${h(dettaglio)}</span></span>
        ${c.in_coda ? `<button class="btn btn-piccolo" id="btnEsportaOra" type="button">Esporta</button>` : ""}`;
      const be = document.getElementById("btnEsportaOra");
      if (be) be.onclick = () => esportaPerSede(false);
      aggiornaAvanzamentoInvio(c);
      return;
    }
    if (!IF.adapter) {
      classe = "errore"; testo = "Invio non configurato"; dettaglio = erroreConfig || "";
    } else if (st.connessione === "accesso") {
      classe = "attenzione"; testo = "Accesso richiesto"; dettaglio = st.messaggio;
    } else if (st.inCorso) {
      classe = "invio"; testo = "Invio in corso…"; dettaglio = c.in_coda ? `${c.in_coda} in coda` : "";
    } else if (st.connessione === "offline") {
      classe = "offline"; testo = "Senza rete";
      dettaglio = c.in_coda ? (c.in_coda === 1 ? "1 scheda in coda, partirà da sola" : `${c.in_coda} schede in coda, partiranno da sole`) : "Puoi continuare a compilare";
    } else if (c.in_coda) {
      classe = "attenzione"; testo = `${c.in_coda} da inviare`; dettaglio = "Nuovo tentativo a breve";
    } else {
      classe = "ok"; testo = "Tutto inviato";
      const arrivate = c.inviata + c.importata;
      dettaglio = [arrivate ? `${arrivate === 1 ? "1 scheda arrivata" : `${arrivate} schede arrivate`} in sede` : "Le schede arrivano in sede da sole",
        st.ultimoInvio ? `ultimo invio alle ${IF.ora(st.ultimoInvio)}` : ""].filter(Boolean).join(" · ");
    }
    el.className = `stato-invio ${classe}`;
    el.innerHTML = `
      <span class="spia" aria-hidden="true"></span>
      <span class="testo"><strong>${h(testo)}</strong>${dettaglio ? `<span>${h(dettaglio)}</span>` : ""}</span>
      ${IF.adapter && st.connessione === "accesso" && IF.adapter.nome !== "demo"
        ? `<button class="btn btn-piccolo" id="btnAccedi" type="button">Accedi</button>`
        : IF.adapter && c.in_coda ? `<button class="btn btn-piccolo" id="btnInviaOra" type="button" ${st.inCorso ? "disabled" : ""}>Invia ora</button>` : ""}`;
    const b = document.getElementById("btnInviaOra");
    if (b) b.onclick = () => conCaricamento(b, "Invio…", () => IF.Sync.adesso());
    const acc = document.getElementById("btnAccedi");
    if (acc) acc.onclick = () => IF.adapter.accedi();
    aggiornaAvanzamentoInvio(c);
  }

  // Barra "arrivate in sede" nel riquadro principale
  function aggiornaAvanzamentoInvio(c) {
    const el = document.getElementById("avanzamentoInvio");
    if (!el) return;
    // la barra serve solo mentre qualcosa e' in viaggio; a lavoro finito basta la riga «Tutto inviato»
    const inViaggio = c.in_coda + c.inviata > 0;
    el.hidden = !inViaggio;
    el.closest(".hero")?.classList.toggle("senza-barra", !inViaggio);
    if (!inViaggio) return;
    const arrivate = c.inviata + c.importata;
    const pct = (n) => (c.totale ? (n / c.totale) * 100 : 0);
    const html = FILE ? `
      <div class="avanzamento-riga"><span>${c.inviata} di ${c.totale} esportate</span><span>${c.in_coda} da esportare</span></div>
      <div class="traccia" role="img" aria-label="${c.inviata} schede su ${c.totale} esportate">
        <span class="r-ok" style="width:${pct(c.inviata)}%"></span>
      </div>` : `
      <div class="avanzamento-riga"><span>${arrivate} di ${c.totale} arrivate in sede</span><span>${c.importata} importate</span></div>
      <div class="traccia" role="img" aria-label="${arrivate} schede su ${c.totale} arrivate in sede">
        <span class="r-ok" style="width:${pct(c.importata)}%"></span><span class="r-accento" style="width:${pct(c.inviata)}%"></span>
      </div>`;
    if (el.dataset.firma === html) return;
    el.innerHTML = html; el.dataset.firma = html;
  }

  // Pulsante con stato di caricamento durante un'operazione
  async function conCaricamento(btn, testo, fn) {
    const prima = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="rotella" aria-hidden="true"></span><span>${h(testo)}</span>`;
    try { await fn(); } finally { if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = prima; } }
  }

      <div class="suggerimenti" id="suggerimenti"></div>
